services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    environment:
      POSTGRES_USER: scol
      POSTGRES_PASSWORD: scolpwd
      POSTGRES_DB: scolaris
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "scol"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    container_name: redis
    ports: ["6379:6379"]

  api:
    build: ./agent-service
    container_name: agent-api
    env_file: ./agent-service/.env
    environment:
      EMBEDDING_SERVICE_URL: ${EMBEDDING_SERVICE_URL:-http://embedding-service:8100/embed}
      LLM_SERVICE_URL: ${LLM_SERVICE_URL:-http://llm-service:8200/generate}
    depends_on:
      embedding-service:
        condition: service_started
      llm-service:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports: ["8000:8000"]
    volumes:
      - ./agent-service/app/data/uploads:/app/app/data/uploads

  worker:
    build: ./agent-service
    container_name: agent-worker
    command: ["python", "-m", "app.ingestion.worker"]
    env_file: ./agent-service/.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    profiles: ["worker"]
    volumes:
      - ./agent-service/app/data/uploads:/app/app/data/uploads

  embedding-service:
    build: ./embedding-service
    container_name: embedding-service
    env_file: ./agent-service/.env
    expose: ["8100"]

  llm-service:
    build: ./llm-service
    container_name: llm-service
    env_file: ./agent-service/.env
    expose: ["8200"]
