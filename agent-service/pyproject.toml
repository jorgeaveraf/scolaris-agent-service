[project]
name = "scolaris-agent"
version = "0.1.0"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "langchain>=0.2.0",
  "langgraph>=0.2.0",
  "sqlalchemy>=2.0.0",
  "psycopg[binary]>=3.1.0",
  "redis>=5.0.0",
  "pgvector>=0.2.5",
  "python-dotenv>=1.0.1",
  "httpx>=0.25.0",
  "openai>=1.30.0",
  "langchain-openai>=0.1.14",
  "langchain-text-splitters>=0.2.4",
  "pypdf>=4.2.0"
]
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
